---
layout: default
---
<article class="project">
  <header class="project__header" style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('{{ page.hero | relative_url }}')">
    <h1>{{ page.title }}</h1>
    {% if page.skills %}
      <p class="project__tags">{{ page.skills | join: " · " }}</p>
    {% endif %}
  </header>

  <div class="project__content">
    {{ content }}
  </div>

  <p><a href="{{ '/experiences/' | relative_url }}">← All projects</a></p>
</article>
